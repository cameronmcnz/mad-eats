spring.application.name=api
server.port=${SPRINGBOOT_PORT:8099}

spring.datasource.url=jdbc:h2:mem:madmoney
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-consolespring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.root=WARN
logging.level.com.eatrading.api=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Jackson Configuration
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Error Handling
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

# Fauxnance Market Data API
fauxnance.api.url=${FAUXNANCE_API_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api.key=${FAUXNANCE_API_KEY}
fauxnance.api.timeout=10000
fauxnance.api.cache.ttl=300
spring.web.error.include-stacktrace=on-param


spring.kafka.bootstrap-servers=127.0.0.1:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=order-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eatrading.api.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.eatrading.api.dto.OrderTransactionRequest
